[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-ranges"
version = "0.1.0"
description = "Leakage-safe preseason fantasy football range projections"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.18"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.4"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]

[project.scripts]
fantasy-ranges = "fantasy_ranges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
